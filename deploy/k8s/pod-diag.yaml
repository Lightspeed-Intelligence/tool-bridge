# tb-pod-diag:集群内只读诊断服务,反向注册到 tool-bridge 树 tools/pod-diag。
#
# 安全模型(结构性只读,不依赖任何可绕过的软约束作为最终边界):
#   - 授权面 = Role(限 namespace,非 ClusterRole)只给 pods / pods/log / events 的
#     get/list。这些子资源在 K8s API 层【没有写动作】,只读是内核保证,攻破本 pod
#     也偷不到写/exec 能力。
#   - 无 shell、无 exec、无 kubectl 二进制;Agent 只能调用六个结构化只读工具。
#   - SA token 只在本 pod 内,不经 Agent、不经网关。
#
# 前置:
#   1) 构建推送镜像(见 pod-diag/Dockerfile),替换下方 image;
#   2) 建 device SK Secret(scope 只需 device 注册权):
#        kubectl -n tool-bridge create secret generic tb-device-sk \
#          --from-literal=sk='<你的 device SK>'
#   3) 把 ALLOWED_NAMESPACES 改成你真正要排查的 namespace(逗号分隔);
#      并为【每一个】这样的 namespace 各建一份下面的 Role + RoleBinding
#      (本文件示例只覆盖 default,多 ns 需复制 Role/RoleBinding 段并改 namespace)。
---
apiVersion: v1
kind: Namespace
metadata:
  name: tool-bridge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-diag
  namespace: tool-bridge
---
# 只读诊断 Role —— 需在【每个被查询的 namespace】各建一份(此处示例:default)。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tb-pod-diag-reader
  namespace: default           # ← 被查询的目标 namespace
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tb-pod-diag-reader
  namespace: default           # ← 与上面 Role 的 namespace 一致
subjects:
  - kind: ServiceAccount
    name: pod-diag
    namespace: tool-bridge     # SA 在 tool-bridge ns,被授权读 default ns
roleRef:
  kind: Role
  name: tb-pod-diag-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-pod-diag
  namespace: tool-bridge
spec:
  replicas: 1                  # deviceId 固定,重建后自动重连复用同一树节点
  selector:
    matchLabels: { app: tb-pod-diag }
  template:
    metadata:
      labels: { app: tb-pod-diag }
    spec:
      serviceAccountName: pod-diag
      automountServiceAccountToken: true   # client-node loadFromCluster 需要
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pod-diag
          image: <your-registry>/tb-pod-diag:0.1.0   # ← 改成你推送后的镜像地址
          env:
            - name: TB_BASE_URL
              value: "https://your-tb.example.com"     # ← 你的网关地址
            - name: TB_SK
              valueFrom:
                secretKeyRef: { name: tb-device-sk, key: sk }
            - name: TB_DEVICE_ID
              value: "pod-diag"
            - name: ALLOWED_NAMESPACES
              value: "default"                          # ← 逗号分隔;须与上面 Role 覆盖的 ns 一致
            - name: MAX_TAIL_LINES
              value: "2000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
